[project]
name = "multi-entity-revenue-reconciliation"
version = "0.1.0"
description = "Tiered CRM-to-ledger revenue reconciliation across many legal entities, demonstrated on synthetic data."
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
recon = "recon.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
